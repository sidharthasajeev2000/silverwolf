name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cp dist/index.html dist/404.html
      - name: Static HTML per route so crawlers get HTTP 200
        run: |
          for url in $(grep -o '<loc>[^<]*' dist/sitemap.xml | sed 's#<loc>https://silverwolf.in##'); do
            [ "$url" = "/" ] && continue
            mkdir -p "dist$(dirname "$url")"
            sed -e "s#rel=\"canonical\" href=\"https://silverwolf.in/\"#rel=\"canonical\" href=\"https://silverwolf.in$url\"#" \
                -e "s#property=\"og:url\" content=\"https://silverwolf.in/\"#property=\"og:url\" content=\"https://silverwolf.in$url\"#" \
                dist/index.html > "dist$url.html"
            echo "wrote dist$url.html"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
